name: Formula CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -v
      - run: ruby -c Formula/tuxedotask.rb
      - run: git diff --check
  install:
    name: Homebrew ${{ matrix.os }}
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - run: brew install caracolaracol/tap/tuxedotask
      - run: brew test caracolaracol/tap/tuxedotask
      - run: tuxedo --version && tuxedotask --version
